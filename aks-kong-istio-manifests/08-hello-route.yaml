apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-world-1
  namespace: hello-app
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong-gateway
      namespace: kong
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong-gateway
      namespace: kong
      sectionName: https
  hostnames:
    - gateway-rgs.eastus.cloudapp.azure.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hello-world-1-svc
          port: 80
