apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-1
  namespace: hello-app
  labels:
    app.kubernetes.io/name: hello-world-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world-1
    spec:
      containers:
        - name: hello-world
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-1-svc
  namespace: hello-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello-world-1
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello-world-1
  namespace: hello-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world-1
