apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: hello-app
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-kong-and-same-namespace
  namespace: hello-app
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - kong
              - hello-app
